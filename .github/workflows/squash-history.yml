# Save in your repo as .github/workflows/squash-history.yml
# Once a week, replaces the repo's history with a single commit of the
# current files (the last 30 days of episodes), so deleted episodes don't
# pile up in git history. Run it by hand from the Actions tab anytime.
name: Squash history

on:
  schedule:
    - cron: "17 8 * * 0"   # Sundays, 08:17 UTC (2:17 AM Central), when no episode is publishing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace history with one snapshot commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -m "Daily Briefing feed snapshot (last 30 days)"
          git push --force origin snapshot:main
